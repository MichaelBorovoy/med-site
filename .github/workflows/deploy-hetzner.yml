name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Trust Hetzner host key
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          PORT="${HETZNER_SSH_PORT:-22}"
          ssh-keyscan -p "${PORT}" -H "${HETZNER_HOST}" >> ~/.ssh/known_hosts

      - name: Rsync release to /opt/harborcare
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${HETZNER_SSH_PORT:-22}"
          rsync -az --delete \
            -e "ssh -p ${PORT}" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'data/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.cursor/' \
            --exclude 'coverage/' \
            ./ "${HETZNER_USER}@${HETZNER_HOST}:/opt/harborcare/"

      - name: Build and restart containers
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${HETZNER_SSH_PORT:-22}"
          ssh -p "${PORT}" "${HETZNER_USER}@${HETZNER_HOST}" \
            'chmod +x /opt/harborcare/deploy/hetzner/*.sh && /opt/harborcare/deploy/hetzner/deploy.sh'
